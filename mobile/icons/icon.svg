<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  
  <!-- Subtle accent radial ambient glow -->
  <circle cx="256" cy="256" r="140" fill="#4ade80" opacity="0.12" filter="url(#glow)"/>
  
  <!-- Modern Dumbbell Emblem (Angled 45 deg) -->
  <g transform="translate(256,256) rotate(-45) translate(-256,-256)">
    <!-- Central Bar Handle with knurling lines -->
    <rect x="216" y="240" width="80" height="32" rx="8" fill="#e4e4e7"/>
    <line x1="236" y1="244" x2="236" y2="268" stroke="#71717a" stroke-width="3" stroke-linecap="round"/>
    <line x1="256" y1="244" x2="256" y2="268" stroke="#71717a" stroke-width="3" stroke-linecap="round"/>
    <line x1="276" y1="244" x2="276" y2="268" stroke="#71717a" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Left Inner Collar -->
    <rect x="196" y="226" width="20" height="60" rx="6" fill="#a1a1aa"/>
    <!-- Left Outer Weight Plate Small -->
    <rect x="160" y="200" width="36" height="112" rx="10" fill="url(#accentGrad)"/>
    <!-- Left Outer Weight Plate Large -->
    <rect x="120" y="176" width="40" height="160" rx="12" fill="#27272a" stroke="url(#accentGrad)" stroke-width="5"/>
    <circle cx="140" cy="256" r="14" fill="url(#accentGrad)"/>
    
    <!-- Right Inner Collar -->
    <rect x="296" y="226" width="20" height="60" rx="6" fill="#a1a1aa"/>
    <!-- Right Outer Weight Plate Small -->
    <rect x="316" y="200" width="36" height="112" rx="10" fill="url(#accentGrad)"/>
    <!-- Right Outer Weight Plate Large -->
    <rect x="352" y="176" width="40" height="160" rx="12" fill="#27272a" stroke="url(#accentGrad)" stroke-width="5"/>
    <circle cx="372" cy="256" r="14" fill="url(#accentGrad)"/>
  </g>
</svg>
